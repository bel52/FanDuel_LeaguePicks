version: "3.8"
services:
  dfs-web:
    build: .
    container_name: dfs-web
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  redis:
    image: redis:latest
    container_name: dfs-redis
